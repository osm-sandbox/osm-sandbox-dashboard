{{- if .Values.dashboard.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-dashboard-web
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ template "osm-sandbox.name" . }}
    component: web-deployment
    environment: {{ .Values.environment }}
    release: {{ .Release.Name }}
spec:
  replicas: 1
  {{- with .Values.dashboard.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ template "osm-sandbox.name" . }}
      release: {{ .Release.Name }}
      run: {{ .Release.Name }}-dashboard-web
  template:
    metadata:
      labels:
        app: {{ template "osm-sandbox.name" . }}
        release: {{ .Release.Name }}
        run: {{ .Release.Name }}-dashboard-web
    spec:
      serviceAccountName: {{ .Values.namespace }}-helm-service-account
      initContainers:
        - name: init-check-db
          image: busybox
          command:
            - /bin/sh
            - -c
            - |
              until nc -z -v -w30 ${POSTGRES_HOST} 5432
              do
                echo "Waiting for database connection..."
                sleep 5
              done
              echo "Database is up!"
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-dashboard-common-env
{{- if .Values.extraEnvFrom }}
{{ toYaml .Values.extraEnvFrom | indent 12 }}
{{- end }}
      containers:
        - name: {{ .Chart.Name }}-dashboard
          image: "{{ .Values.dashboard.image.name }}:{{ .Values.dashboard.image.tag }}"
          # command:
          #   - /bin/sh
          #   - -c
          #   - |
          #     sleep 300000000;
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 120
            timeoutSeconds: 60
          {{- if .Values.dashboard.resources.enabled }}
          resources:
            requests:
              memory: {{ .Values.dashboard.resources.requests.memory }}
              cpu: {{ .Values.dashboard.resources.requests.cpu }}
            limits:
              memory: {{ .Values.dashboard.resources.limits.memory }}
              cpu: {{ .Values.dashboard.resources.limits.cpu }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-dashboard-common-env
{{- if .Values.extraEnvFrom }}
{{ toYaml .Values.extraEnvFrom | indent 12 }}
{{- end }}
          volumeMounts:
            - name: applied-templates-storage
              mountPath: {{ .Values.dashboard.persistenceDisk.mountPath }}
              subPath: {{ .Values.dashboard.persistenceDisk.subPath }}
          imagePullPolicy: Always
      volumes:
        - name: applied-templates-storage
        {{- if .Values.dashboard.persistenceDisk.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-dashboard-web-pv-claim
        {{- else }}
          emptyDir: {}
        {{- end }}
      {{- if .Values.dashboard.nodeSelector.enabled }}
      nodeSelector:
        {{ .Values.dashboard.nodeSelector.label_key }} : {{ .Values.dashboard.nodeSelector.label_value }}
      {{- end }}
{{- end }}